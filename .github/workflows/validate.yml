name: Validate RouteFlow
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check backend JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check worker/scripts/import-route-data.mjs
          node --check worker/scripts/validate-route-data.mjs
      - name: Validate route archive for D1 import
        run: node worker/scripts/validate-route-data.mjs
      - name: Validate JSON data and app manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); JSON.parse(require('fs').readFileSync('data/routes.json', 'utf8')); console.log('Manifest and route database JSON are valid.')"
      - name: Verify service-worker app-shell assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('service-worker.js', 'utf8');
          const match = source.match(/const APP_SHELL = \[([\s\S]*?)\];/);
          if (!match) throw new Error('APP_SHELL array not found');
          const assets = [...match[1].matchAll(/["']([^"']+)["']/g)].map(item => item[1]);
          const missing = assets.filter(asset => !fs.existsSync(asset.replace(/^\.\//, '') || 'index.html'));
          if (missing.length) throw new Error('Missing app-shell assets: ' + missing.join(', '));
          console.log('All ' + assets.length + ' app-shell assets exist.');
          const migrationDir = 'worker/migrations';
          const migrations = fs.readdirSync(migrationDir).filter(name => name.endsWith('.sql'));
          const versions = migrations.map(name => name.match(/^(\\d+)_/)?.[1]).filter(Boolean);
          if (new Set(versions).size !== versions.length) throw new Error('Duplicate D1 migration version prefixes: ' + versions.join(', '));
          const routes = JSON.parse(fs.readFileSync('data/routes.json', 'utf8'));
          const allRoutes = [...(routes.current || []), ...(routes.withdrawn || [])];
          for (const route of allRoutes) for (const photo of (route.Images || [])) {
            const src = typeof photo === 'string' ? photo : photo.src;
            if (!/^https:\\/\\//i.test(src || '')) throw new Error('Route ' + route.Route + ' has a non-HTTPS photo URL');
            if (typeof photo === 'object' && photo.source && !/^https:\\/\\//i.test(photo.source)) throw new Error('Route ' + route.Route + ' has an invalid photo source URL');
          }
          console.log('D1 migration versions and route photo URLs are valid.');
          NODE
