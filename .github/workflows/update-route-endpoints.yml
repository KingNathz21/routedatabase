name: Update route endpoints from TfL

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-route-endpoints
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Start and Destination from TfL
        env:
          TFL_API_KEY: ${{ secrets.TFL_API_KEY }}
        run: node scripts/update-route-endpoints.mjs

      - name: Commit updated routes.json
        run: |
          if git diff --quiet -- data/routes.json; then
            echo "No route endpoint changes found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json
          git commit -m "Update route endpoints from TfL"
          git push
