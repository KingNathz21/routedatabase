name: Validate RouteFlow backend

on:
  pull_request:
    paths:
      - "worker/**"
      - "data/routes.json"
      - ".github/workflows/worker-validation.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "data/routes.json"
      - ".github/workflows/worker-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check worker/scripts/import-route-data.mjs
          node --check worker/scripts/validate-route-data.mjs
      - name: Validate route archive
        run: node worker/scripts/validate-route-data.mjs
