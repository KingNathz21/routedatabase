name: Update route database batch

on:
  push:
    paths:
      - ".github/workflows/update-routes-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update routes 15 to 25
        run: |
          python .github/scripts/update_routes_batch_15_25.py
          python .github/scripts/update_route_16.py

      - name: Commit routes.json
        run: |
          if git diff --quiet -- data/routes.json; then
            echo "No route changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json
          git commit -m "Fill route details for routes 15-25"
          git push
